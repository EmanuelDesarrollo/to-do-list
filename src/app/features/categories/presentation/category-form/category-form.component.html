<form class="sheet" [formGroup]="form" (ngSubmit)="save()">
  <h2 class="app-display">{{ isEditMode ? 'Editar categoría' : 'Nueva categoría' }}</h2>

  <div class="field">
    <label for="category-name">Nombre</label>
    <div class="app-field">
      <ion-input
        id="category-name"
        formControlName="name"
        placeholder="Ej. Mascotas"
        aria-label="Nombre"
        enterkeyhint="done"
      ></ion-input>
    </div>
  </div>

  <div class="field">
    <label>Color</label>
    <app-color-palette-picker formControlName="color"></app-color-palette-picker>
  </div>

  <div class="actions">
    <ion-button shape="round" fill="outline" class="cancel" (click)="cancel()">Cancelar</ion-button>
    <ion-button shape="round" type="submit" color="secondary">Guardar</ion-button>
  </div>
</form>
