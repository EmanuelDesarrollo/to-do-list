<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (loading()) {
    <div class="state-container">
      <ion-spinner></ion-spinner>
    </div>
  } @else if (categories().length === 0) {
    <div class="state-container">
      <p>Aún no hay categorías. Crea la primera con el botón +.</p>
    </div>
  } @else {
    <ion-list>
      @for (category of categories(); track category.id) {
        <ion-item-sliding>
          <ion-item button [detail]="false" (click)="onEditCategory(category)">
            <app-category-chip slot="start" [category]="category"></app-category-chip>
            <ion-label>{{ category.name }}</ion-label>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="onDeleteCategory(category)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  }

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="onAddCategory()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
