<ion-header class="ion-no-border">
  <ion-toolbar>
    <!-- Contenedor único: el toolbar de iOS acomoda a sus hijos directos en fila. -->
    <div class="toolbar-stack">
      <app-header title="To-do-lit" [subtitle]="subtitle()"></app-header>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (loading()) {
    <app-skeleton-list variant="category"></app-skeleton-list>
  } @else if (categories().length === 0) {
    <app-empty-state
      icon="pricetag-outline"
      color="secondary"
      title="Sin categorías todavía"
      message="Crea categorías para organizar y colorear tus tareas."
      actionLabel="Agregar categoría"
      (action)="onAddCategory()"
    ></app-empty-state>
  } @else {
    <ion-list lines="none">
      @for (category of categories(); track category.id) {
        <ion-item-sliding #sliding>
          <ion-item button [detail]="false" (click)="onEditCategory(category)">
            <span slot="start" class="dot" [style.background]="category.color || neutralColor"></span>
            <ion-label>
              <h2>{{ category.name }}</h2>
              <p>{{ countLabel(category) }}</p>
            </ion-label>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option color="secondary" (click)="sliding.close(); onEditCategory(category)">
              <ion-icon slot="top" name="create-outline"></ion-icon>
              Editar
            </ion-item-option>
            <ion-item-option color="danger" (click)="sliding.close(); onDeleteCategory(category)">
              <ion-icon slot="top" name="trash-outline"></ion-icon>
              Eliminar
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  }

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button aria-label="Nueva categoría" (click)="onAddCategory()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
