<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">Cancelar</ion-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Editar tarea' : 'Nueva tarea' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button [strong]="true" (click)="save()">Guardar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-item>
      <ion-input label="Título" labelPlacement="floating" formControlName="title" placeholder="Ej. Comprar víveres"></ion-input>
    </ion-item>

    <div class="category-field">
      <ion-label>Categoría</ion-label>
      <app-category-picker [categories]="categories" formControlName="categoryId"></app-category-picker>
    </div>
  </form>
</ion-content>
