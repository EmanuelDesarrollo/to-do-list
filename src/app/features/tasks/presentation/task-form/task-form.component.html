<form class="sheet" [formGroup]="form" (ngSubmit)="save()">
  <h2 class="app-display">{{ isEditMode ? 'Editar tarea' : 'Nueva tarea' }}</h2>

  <div class="field">
    <label for="task-title">Título</label>
    <div class="app-field">
      <ion-input
        id="task-title"
        formControlName="title"
        placeholder="Ej. Pagar la luz"
        aria-label="Título"
        enterkeyhint="done"
      ></ion-input>
    </div>
  </div>

  <div class="field">
    <label>Categoría</label>
    <app-category-picker [categories]="categories" formControlName="categoryId"></app-category-picker>
  </div>

  <div class="actions">
    <ion-button shape="round" fill="outline" class="cancel" (click)="cancel()">Cancelar</ion-button>
    <ion-button shape="round" type="submit" color="primary">Guardar</ion-button>
  </div>
</form>
