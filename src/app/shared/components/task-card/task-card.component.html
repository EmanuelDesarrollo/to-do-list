<ion-item-sliding #sliding>
  <ion-item lines="none" button [detail]="false" (click)="edit.emit()">
    <ion-checkbox
      slot="start"
      aria-label="Marcar como completada"
      [checked]="task.completed"
      (click)="$event.stopPropagation()"
      (ionChange)="toggleComplete.emit()"
    ></ion-checkbox>

    <ion-label [class.completed]="task.completed">
      <h2>{{ task.title }}</h2>
      <div class="meta">
        <app-category-chip [label]="category?.name ?? 'Sin categoría'" [color]="category?.color ?? null"></app-category-chip>
        <span class="date">{{ createdLabel }}</span>
      </div>
    </ion-label>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option color="secondary" (click)="sliding.close(); edit.emit()">
      <ion-icon slot="top" name="create-outline"></ion-icon>
      Editar
    </ion-item-option>
    <ion-item-option color="danger" (click)="sliding.close(); remove.emit()">
      <ion-icon slot="top" name="trash-outline"></ion-icon>
      Eliminar
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
