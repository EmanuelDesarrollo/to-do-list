<ion-item-sliding>
  <ion-item button [detail]="false" (click)="edit.emit()">
    <ion-checkbox
      slot="start"
      [checked]="task.completed"
      (click)="$event.stopPropagation()"
      (ionChange)="toggleComplete.emit()"
    ></ion-checkbox>

    <ion-label [class.completed]="task.completed">
      <h2>{{ task.title }}</h2>
      @if (category) {
        <app-category-chip [category]="category"></app-category-chip>
      }
    </ion-label>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option color="danger" (click)="remove.emit()">
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
