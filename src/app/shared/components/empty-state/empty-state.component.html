<div class="empty" [class.secondary]="color === 'secondary'">
  <div class="icon-circle">
    <ion-icon [name]="icon" [color]="color"></ion-icon>
  </div>
  <h2 class="app-display">{{ title }}</h2>
  @if (message) {
  <p>{{ message }}</p>
  }
  @if (actionLabel) {
  <ion-button shape="round" [color]="color" (click)="action.emit()">{{ actionLabel }}</ion-button>
  }
</div>
