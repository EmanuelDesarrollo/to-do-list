<ion-chip [class.tag]="variant === 'tag'" [class.select]="variant === 'select'" [class.selected]="selected"
  [style.--cat-color]="color || neutralColor" [attr.role]="variant === 'select' ? 'button' : null"
  [attr.aria-pressed]="variant === 'select' ? selected : null">
  <ion-label>{{ label }}</ion-label>
</ion-chip>
